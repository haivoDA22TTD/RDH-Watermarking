version: '3.8'

services:
  rdh-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdh_spring_boot_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Thiết lập bộ nhớ nếu thuật toán giấu tin xử lý ảnh lớn/ma trận nặng
      - JAVA_OPTS=-Xms256m -Xmx1024m
    restart: unless-stopped