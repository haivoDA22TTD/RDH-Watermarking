# Validation Messages for RDH Backend
# This file contains custom validation error messages for Bean Validation

# ===========================
# Common Validation Messages
# ===========================
jakarta.validation.constraints.NotNull.message=Field is required and cannot be null
jakarta.validation.constraints.NotBlank.message=Field is required and cannot be blank
jakarta.validation.constraints.NotEmpty.message=Field is required and cannot be empty

# ===========================
# WatermarkRequest Validation
# ===========================
watermark.text.notblank=Watermark text is required and cannot be blank
watermark.text.size=Watermark text must be between {min} and {max} characters
watermark.text.pattern=Watermark text must contain only printable ASCII characters (space to tilde, ASCII 32-126)
watermark.text.delimiter=Watermark text cannot contain reserved delimiter '###END###'

watermark.algorithm.notnull=Watermark algorithm is required
watermark.algorithm.invalid=Invalid watermark algorithm. Allowed values: DCT, DWT, LSB_ROBUST

watermark.strength.notnull=Watermark strength is required
watermark.strength.min=Watermark strength must be at least {value}
watermark.strength.max=Watermark strength must not exceed {value}
watermark.strength.range=Watermark strength must be between 0 and 100

# ===========================
# EmbedRequest Validation
# ===========================
embed.secretdata.notblank=Secret data is required and cannot be blank
embed.secretdata.size=Secret data must be between {min} and {max} characters
embed.secretdata.pattern=Secret data must contain only printable ASCII characters (space to tilde, ASCII 32-126)

# ===========================
# Image File Validation
# ===========================
image.file.null=Image file is required
image.file.empty=Image file cannot be empty (0 bytes)
image.file.size.single=File size exceeds maximum allowed size of 10 MB
image.file.size.batch=Total batch size exceeds maximum allowed size of 200 MB
image.file.format=Invalid image format. Allowed formats: PNG, JPG, JPEG, BMP
image.file.extension=Invalid file extension. Allowed extensions: png, jpg, jpeg, bmp
image.file.corrupted=Cannot read file as image. File may be corrupted or not a valid image
image.file.dimensions.min=Image dimensions too small. Minimum: {min}x{min} pixels
image.file.dimensions.max=Image dimensions too large. Maximum: {max}x{max} pixels
image.file.dimensions.notdivisible=Image dimensions should be divisible by 8 for optimal DCT performance

# ===========================
# Capacity Validation
# ===========================
capacity.insufficient=Insufficient image capacity for the watermark text
capacity.required=Required capacity: {required} bits
capacity.available=Available capacity: {available} bits
capacity.deficit=Capacity deficit: {deficit} bits
capacity.suggestion.shorter=Try using shorter watermark text
capacity.suggestion.larger=Try using a larger image
capacity.suggestion.reduce=Try reducing embedding strength or image complexity
capacity.warning.high=Using {percent}% of image capacity. Embedding might be less robust.

# ===========================
# Algorithm Validation
# ===========================
algorithm.unsupported=Algorithm '{name}' is not supported
algorithm.rdh.available=Available RDH algorithms: LSB, HISTOGRAM_SHIFTING, DIFFERENCE_EXPANSION
algorithm.watermark.available=Available watermark algorithms: DCT, DWT, SVD
algorithm.attack.unsupported=Attack type '{type}' is not supported or cannot be simulated
algorithm.incompatible=Algorithm '{name}' cannot be used with current parameters: {issue}

# ===========================
# Extraction Validation
# ===========================
extraction.notfound=Watermark not found in image
extraction.delimiter.notfound=Watermark delimiter '{delimiter}' not found in extracted data
extraction.corrupted=Extracted data is invalid or corrupted
extraction.attack.damaged=Watermark corrupted or destroyed by {attack} attack
extraction.nodata=No embedded data detected in image
extraction.reason.nowatermark=Image may not contain a watermark
extraction.reason.removed=Watermark may have been removed by image processing
extraction.reason.wrongalgorithm=Wrong extraction algorithm may have been used

# ===========================
# Parameter Validation
# ===========================
param.strength.invalid=Invalid strength parameter
param.algorithm.invalid=Invalid algorithm parameter
param.attacks.empty=At least one attack type is required for robustness testing
param.attacks.invalid=Invalid attack type in list

# ===========================
# File Upload Validation
# ===========================
upload.maxsize.exceeded=File upload size exceeded. Maximum allowed: 200 MB
upload.batch.empty=At least one image file is required for batch processing
upload.batch.maxcount=Too many files. Maximum allowed: 100 files per batch

# ===========================
# General Error Messages
# ===========================
error.internal=Internal server error occurred. Please contact administrator.
error.processing=Error processing request
error.io=I/O error occurred while processing file
error.unexpected=An unexpected error occurred

# ===========================
# Success Messages
# ===========================
success.embed=Watermark embedded successfully
success.extract=Watermark extracted successfully
success.evaluate=Image quality evaluation completed
success.robustness=Robustness test completed
success.batch.embed=Batch embedding completed
success.batch.extract=Batch extraction completed
