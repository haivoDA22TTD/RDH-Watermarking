server.port=8080
spring.application.name=rdh-backend

# Cấu hình giới hạn dung lượng upload file ảnh
spring.servlet.multipart.enabled=true
# Tăng lên 200MB để support batch upload (20 ảnh × 10MB/ảnh)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ============================================
# Swagger/OpenAPI Configuration
# ============================================

# Swagger UI path: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

# Đường dẫn API docs JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# Tự động sắp xếp tags theo alphabet
springdoc.swagger-ui.tags-sorter=alpha

# Sắp xếp operations (endpoints) theo HTTP method
springdoc.swagger-ui.operations-sorter=method

# Enable Try-it-out cho tất cả operations
springdoc.swagger-ui.try-it-out-enabled=true

# Hiển thị request duration trong responses
springdoc.swagger-ui.display-request-duration=true

# Disable Swagger UI validation badge (tối ưu UI)
springdoc.swagger-ui.disable-swagger-default-url=true

# Show extensions (x-*) trong schemas
springdoc.swagger-ui.show-extensions=true

# Default expand/collapse: list (chỉ show list), full (expand all), none (collapse all)
springdoc.swagger-ui.doc-expansion=list

# Filter bar để search endpoints nhanh
springdoc.swagger-ui.filter=true

# Support CORS cho Swagger UI
springdoc.swagger-ui.csrf.enabled=false
