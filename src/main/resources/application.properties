server.port=8080
spring.application.name=rdh-backend

# Cấu hình giới hạn dung lượng upload file ảnh
spring.servlet.multipart.enabled=true
# Tăng lên 200MB để support batch upload (20 ảnh × 10MB/ảnh)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ============================================
# Logging Configuration
# ============================================

# Log levels
logging.level.root=INFO
logging.level.com.rdh.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Log file location (overridden by logback-spring.xml)
logging.file.path=./logs
logging.file.name=./logs/rdh-backend.log

# Log pattern (can be overridden by logback-spring.xml)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Enable request logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
server.error.include-message=always
server.error.include-stacktrace=on_param

# ============================================
# Swagger/OpenAPI Configuration
# ============================================

# Swagger UI path: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

# Đường dẫn API docs JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# Tự động sắp xếp tags theo alphabet
springdoc.swagger-ui.tags-sorter=alpha

# Sắp xếp operations (endpoints) theo HTTP method
springdoc.swagger-ui.operations-sorter=method

# Enable Try-it-out cho tất cả operations
springdoc.swagger-ui.try-it-out-enabled=true

# Hiển thị request duration trong responses
springdoc.swagger-ui.display-request-duration=true

# Disable Swagger UI validation badge (tối ưu UI)
springdoc.swagger-ui.disable-swagger-default-url=true

# Show extensions (x-*) trong schemas
springdoc.swagger-ui.show-extensions=true

# Default expand/collapse: list (chỉ show list), full (expand all), none (collapse all)
springdoc.swagger-ui.doc-expansion=list

# Filter bar để search endpoints nhanh
springdoc.swagger-ui.filter=true

# Support CORS cho Swagger UI
springdoc.swagger-ui.csrf.enabled=false

# ============================================
# CORS Configuration
# ============================================

# Cho phép tất cả origins (Development mode)
# Production: nên chỉ định cụ thể trong CorsConfig.java
cors.allowed-origins=*

# Allowed methods
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Max age for preflight requests (1 hour)
cors.max-age=3600

# ============================================
# Rate Limiting Configuration
# ============================================

# Enable/disable rate limiting
rate-limit.enabled=true

# Rate limit: số requests tối đa trong time window
rate-limit.capacity=100

# Time window để refill tokens (phút)
rate-limit.refill-period-minutes=1

# Số tokens được refill sau mỗi time window
rate-limit.refill-tokens=100

# Cache configuration cho rate limiting
spring.cache.type=caffeine
spring.cache.cache-names=rateLimitBuckets
spring.cache.caffeine.spec=maximumSize=10000,expireAfterAccess=3600s

